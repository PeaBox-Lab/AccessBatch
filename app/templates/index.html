<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AccessBatch</title><style>body{font:15px system-ui;background:#f3f4f6;margin:0;color:#111827}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 1px 3px #0002;margin-bottom:20px}h1{margin:0 0 8px}input{padding:11px;border:1px solid #cbd5e1;border-radius:8px}input[type=url]{width:65%}button{padding:11px 18px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}.muted{color:#64748b}</style></head><body><div class="wrap"><div class="card"><h1>AccessBatch</h1><p class="muted">Repeatable accessibility scans with developer-friendly evidence bundles.</p><form id="f"><input name="target" type="url" required placeholder="https://example.com"><input name="max_pages" type="number" min="1" max="100" value="10"><button>Start scan</button></form><p id="m"></p></div><div class="card"><h2>Recent scans</h2><table><tr><th>Target</th><th>Status</th><th>Pages</th><th>Issues</th><th>Evidence</th></tr>{% for s in scans %}<tr><td>{{s[1]}}</td><td>{{s[2]}}</td><td>{{s[4]}}</td><td>{{s[5]}}</td><td><a href="/report/{{s[0]}}">report</a> · <a href="/bundle/{{s[0]}}">bundle</a></td></tr>{% endfor %}</table></div></div><script>f.onsubmit=async e=>{e.preventDefault();m.textContent='Scan queued…';let r=await fetch('/scan',{method:'POST',body:new FormData(f)});let d=await r.json();if(!r.ok){m.textContent=d.detail||'Failed';return}m.innerHTML='Scan '+d.scan_id+' started. <a href="'+d.status_url+'">status</a>';}</script></body></html>
